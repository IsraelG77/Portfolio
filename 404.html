<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página não encontrada | Israel Gilbernon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg:          #0a0f1e;
      --bg-2:        #0f172a;
      --bg-card:     #111827;
      --bg-card-2:   #1e293b;
      --border:      rgba(255,255,255,0.08);
      --border-h:    rgba(255,255,255,0.16);
      --text:        #f1f5f9;
      --text-mid:    #cbd5e1;
      --text-muted:  #64748b;
      --accent:      #818cf8;
      --accent-2:    #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --grad-hero: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1a0a2e 100%);
      --radius: 14px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── grid dots bg ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(99,102,241,0.12) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
      pointer-events: none;
    }

    /* ── glow orbs ── */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse-orb 6s ease-in-out infinite;
    }

    @keyframes pulse-orb {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ── nav ── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,15,30,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-logo {
      font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em;
      color: #fff; text-decoration: none;
      text-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 20px rgba(192,132,252,0.7);
    }

    /* ── main card ── */
    .container {
      position: relative; z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 560px;
      animation: fade-up 0.6s ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code-block {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.6rem 1.2rem;
      margin-bottom: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .code-block .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,0.6);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .big-number {
      font-size: clamp(7rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(129,140,248,0.3));
      margin-bottom: 1.5rem;
      user-select: none;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      border-radius: 10px;
      font-size: 0.875rem; font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 28px rgba(99,102,241,0.55);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-mid);
      border: 1px solid var(--border-h);
    }
    .btn-secondary:hover {
      background: var(--bg-card-2);
      color: var(--text);
      transform: translateY(-1px);
    }

    /* ── footer hint ── */
    .hint {
      position: fixed; bottom: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.5;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">IG</a>
    </div>
  </nav>

  <div class="container">
    <div class="code-block">
      <span class="dot"></span>
      HTTP 404 — Not Found
    </div>

    <div class="big-number">404</div>

    <h1>Página não encontrada</h1>
    <p>
      A rota que você acessou não existe ou foi movida.<br>
      Verifique o endereço ou volte ao início.
    </p>

    <div class="actions">
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Voltar ao início
      </a>
      <a href="index-en.html" class="btn btn-secondary">
        <i class="fa-solid fa-globe"></i> English version
      </a>
    </div>
  </div>

  <span class="hint">israel-gilbernon.github.io</span>

</body>
</html>
