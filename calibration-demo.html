<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calibration Session Planner — Demo | Israel Gilbernon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0f1117;
      --sf:      #1a1d27;
      --sf2:     #22263a;
      --bd:      #2e3347;
      --text:    #e8eaf0;
      --muted:   #8b90a8;
      --r:       12px;
      --latam:   #6c63ff;
      --na:      #00c9a7;
      --emea:    #ffd166;
      --apac:    #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px; line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 3px; }

    /* ── NAV ─────────────────────────────────────────────────────── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.92); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--bd);
      padding: 0 28px; height: 56px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-title { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
    .nav-right  { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .lang-btn {
      background: none; border: 1px solid var(--bd); border-radius: 6px;
      color: var(--muted); font-size: 11px; font-weight: 700;
      padding: 4px 10px; cursor: pointer; letter-spacing: .5px;
      transition: all .15s;
    }
    .lang-btn.active, .lang-btn:hover { border-color: var(--latam); color: var(--text); }
    .nav-cta {
      background: var(--latam); color: #fff; border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: opacity .15s;
    }
    .nav-cta:hover { opacity: .85; }
    .nav-back {
      border: 1px solid var(--bd); border-radius: 8px; color: var(--muted);
      padding: 7px 12px; font-size: 12px; transition: all .15s;
    }
    .nav-back:hover { border-color: var(--bd); color: var(--text); }

    /* ── BANNER ──────────────────────────────────────────────────── */
    .banner {
      background: rgba(255,209,102,.07); border-bottom: 1px solid rgba(255,209,102,.18);
      padding: 11px 28px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .banner-left { display: flex; align-items: center; gap: 10px; }
    .banner-dot  { width: 8px; height: 8px; border-radius: 50%; background: var(--emea); flex-shrink: 0; }
    .banner-text { font-size: 12px; color: #e8d08a; line-height: 1.5; }
    .banner-text strong { color: var(--emea); }
    .banner-scale {
      font-size: 11px; color: var(--muted);
      background: rgba(255,255,255,.04); border: 1px solid var(--bd);
      border-radius: 20px; padding: 4px 12px; white-space: nowrap;
    }

    /* ── LAYOUT ──────────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 48px 28px 80px; }

    /* ── HERO STATS ──────────────────────────────────────────────── */
    .hero { margin-bottom: 56px; }
    .hero-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--muted); margin-bottom: 16px;
    }
    .hero-title {
      font-size: clamp(22px, 3.5vw, 34px); font-weight: 800;
      letter-spacing: -.5px; line-height: 1.15; margin-bottom: 8px;
    }
    .hero-title span { color: var(--latam); }
    .hero-sub { font-size: 14px; color: var(--muted); max-width: 540px; margin-bottom: 36px; }
    .stats-row {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    }
    .stat {
      background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r);
      padding: 18px 20px;
    }
    .stat-val {
      font-size: 32px; font-weight: 800; letter-spacing: -.5px;
      line-height: 1; margin-bottom: 4px;
    }
    .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

    /* ── SECTION CHROME ──────────────────────────────────────────── */
    .section { margin-bottom: 64px; }
    .section-hd {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; margin-bottom: 24px;
      padding-bottom: 14px; border-bottom: 1px solid var(--bd);
    }
    .section-hd h2 { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
    .section-hd p  { font-size: 12px; color: var(--muted); }

    /* ── SCOPE SECTION ───────────────────────────────────────────── */
    .scope-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .scope-card {
      background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); padding: 22px 24px;
    }
    .scope-card h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 16px; }

    .seniority-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .seniority-name { font-size: 13px; width: 90px; flex-shrink: 0; }
    .seniority-bar-wrap { flex: 1; background: var(--sf2); border-radius: 4px; height: 8px; overflow: hidden; }
    .seniority-bar { height: 100%; border-radius: 4px; background: var(--latam); }
    .seniority-count { font-size: 12px; color: var(--muted); width: 48px; text-align: right; flex-shrink: 0; }

    .partner-list { display: flex; flex-direction: column; gap: 10px; }
    .partner-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .partner-info { display: flex; align-items: center; gap: 8px; }
    .partner-avatar {
      width: 30px; height: 30px; border-radius: 8px;
      background: rgba(108,99,255,.15); border: 1px solid rgba(108,99,255,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--latam); flex-shrink: 0;
    }
    .partner-name { font-size: 13px; }
    .partner-region { font-size: 11px; color: var(--muted); }
    .partner-sessions {
      font-size: 12px; font-weight: 700; color: var(--text);
      background: var(--sf2); border: 1px solid var(--bd);
      border-radius: 20px; padding: 2px 10px; white-space: nowrap;
    }

    /* ── SESSIONS SECTION ────────────────────────────────────────── */
    .region-block { margin-bottom: 40px; }
    .region-hd {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }
    .region-badge {
      font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px;
    }
    .region-badge.latam { background: rgba(108,99,255,.18); color: var(--latam); }
    .region-badge.na    { background: rgba(0,201,167,.15);  color: var(--na);   }
    .region-badge.emea  { background: rgba(255,209,102,.15); color: var(--emea); }
    .region-badge.apac  { background: rgba(255,107,107,.15); color: var(--apac); }
    .region-count { font-size: 12px; color: var(--muted); }

    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .session-card {
      background: var(--sf); border: 1px solid var(--bd);
      border-radius: var(--r); overflow: hidden;
      transition: border-color .15s, transform .15s;
    }
    .session-card:hover { border-color: rgba(255,255,255,.15); transform: translateY(-2px); }
    .session-card-top { height: 3px; }
    .session-card-top.latam { background: var(--latam); }
    .session-card-top.na    { background: var(--na); }
    .session-card-top.emea  { background: var(--emea); }
    .session-card-top.apac  { background: var(--apac); }
    .session-card-body { padding: 16px 18px; }

    .session-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .session-id   { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .level-pill   {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
      border: 1px solid var(--bd); color: var(--text); background: var(--sf2);
    }
    .level-pill.mixed { color: var(--emea); border-color: rgba(255,209,102,.3); background: rgba(255,209,102,.08); }

    .session-roles { margin-bottom: 12px; }
    .role-row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; }
    .role-key { color: var(--muted); }
    .role-val { font-weight: 600; }

    .session-counts { display: flex; gap: 8px; margin-bottom: 12px; }
    .count-box {
      background: var(--sf2); border: 1px solid var(--bd); border-radius: 8px;
      padding: 8px 12px; flex: 1; text-align: center;
    }
    .count-num { font-size: 20px; font-weight: 800; line-height: 1; }
    .count-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    .session-managers { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .mgr-pill {
      font-size: 10px; padding: 2px 8px; border-radius: 20px;
      background: rgba(108,99,255,.1); border: 1px solid rgba(108,99,255,.2); color: #a8a4ff;
    }
    .mgr-pill.na   { background: rgba(0,201,167,.1);   border-color: rgba(0,201,167,.2);   color: #5de8cf; }
    .mgr-pill.emea { background: rgba(255,209,102,.1); border-color: rgba(255,209,102,.2); color: #ffe08a; }
    .mgr-pill.apac { background: rgba(255,107,107,.1); border-color: rgba(255,107,107,.2); color: #ff9696; }

    .session-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
      letter-spacing: .3px; text-transform: uppercase;
    }
    .tag-review    { background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.25); color: var(--apac); }
    .tag-exception { background: rgba(255,209,102,.1);  border: 1px solid rgba(255,209,102,.25); color: var(--emea); }

    .session-footer {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--bd);
    }
    .expand-btn {
      background: none; border: 1px solid var(--bd); border-radius: 6px;
      color: var(--muted); font-size: 11px; font-weight: 600;
      padding: 5px 12px; cursor: pointer; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: color .15s, border-color .15s;
    }
    .expand-btn:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
    .expand-btn .arrow { font-size: 9px; transition: transform .2s; }
    .expand-btn.open .arrow { transform: rotate(180deg); }

    .session-detail {
      display: none; margin-top: 12px;
      border-top: 1px solid var(--bd); padding-top: 12px;
    }
    .session-detail.open { display: block; }
    .detail-table { width: 100%; border-collapse: collapse; }
    .detail-table th {
      font-size: 9px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); font-weight: 700; text-align: left;
      padding: 4px 8px; border-bottom: 1px solid var(--bd);
    }
    .detail-table td {
      font-size: 11px; padding: 5px 8px;
      border-bottom: 1px solid rgba(46,51,71,.5); vertical-align: middle;
    }
    .detail-table tr:last-child td { border-bottom: none; }
    .detail-table tr:hover td { background: rgba(255,255,255,.03); }
    .person-is-mgr {
      font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
      background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.25);
      color: var(--apac); text-transform: uppercase; letter-spacing: .3px;
      white-space: nowrap;
    }

    /* ── LEGEND ──────────────────────────────────────────────────── */
    .legend {
      display: flex; flex-wrap: wrap; gap: 16px;
      margin-top: 20px; padding: 16px 20px;
      background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r);
    }
    .legend-item { display: flex; align-items: flex-start; gap: 8px; }
    .legend-tag  { flex-shrink: 0; margin-top: 1px; }
    .legend-desc { font-size: 11px; color: var(--muted); line-height: 1.5; max-width: 260px; }

    /* ── LOAD SECTION ────────────────────────────────────────────── */
    .load-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .load-card {
      background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r); padding: 22px 24px;
    }
    .load-card h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 18px; }

    .load-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .load-name { font-size: 12px; width: 100px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .load-bar-wrap { flex: 1; background: var(--sf2); border-radius: 4px; height: 8px; overflow: hidden; }
    .load-bar  { height: 100%; border-radius: 4px; }
    .load-bar.latam { background: var(--latam); }
    .load-bar.na    { background: var(--na); }
    .load-bar.emea  { background: var(--emea); }
    .load-bar.apac  { background: var(--apac); }
    .load-val  { font-size: 12px; font-weight: 700; width: 32px; text-align: right; flex-shrink: 0; }

    /* ── RULES CALLOUT ───────────────────────────────────────────── */
    .rules-callout {
      background: rgba(108,99,255,.06); border: 1px solid rgba(108,99,255,.18);
      border-radius: var(--r); padding: 20px 24px; margin-top: 20px;
    }
    .rules-callout h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--latam); margin-bottom: 12px; }
    .rules-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .rule-chip {
      font-size: 11px; padding: 4px 12px; border-radius: 20px;
      background: rgba(108,99,255,.1); border: 1px solid rgba(108,99,255,.2); color: #b8b4ff;
    }

    /* ── FOOTER CTA ──────────────────────────────────────────────── */
    .footer-cta {
      background: var(--sf); border: 1px solid var(--bd); border-radius: var(--r);
      padding: 36px 40px; text-align: center; margin-top: 64px;
    }
    .footer-cta h3 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 10px; }
    .footer-cta p  { font-size: 13px; color: var(--muted); max-width: 480px; margin: 0 auto 24px; line-height: 1.7; }
    .footer-cta a  {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--latam); color: #fff; border-radius: 8px;
      padding: 10px 22px; font-size: 13px; font-weight: 600;
      transition: opacity .15s;
    }
    .footer-cta a:hover { opacity: .85; }

    /* ── RESPONSIVE ──────────────────────────────────────────────── */
    @media (max-width: 860px) {
      .stats-row  { grid-template-columns: repeat(3, 1fr); }
      .scope-grid { grid-template-columns: 1fr; }
      .load-grid  { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .page { padding: 32px 16px 60px; }
      .nav  { padding: 0 16px; }
      .banner { padding: 10px 16px; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .nav-cta { display: none; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <span class="nav-title">Calibration Session Planner</span>
  <div class="nav-right">
    <button class="lang-btn active" id="btn-pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    <a class="nav-cta" href="https://www.linkedin.com/in/gilbernon" target="_blank" rel="noopener">
      <span data-key="cta_nav"></span>
    </a>
    <a class="nav-back" href="index.html" data-key="back"></a>
  </div>
</nav>

<div class="banner">
  <div class="banner-left">
    <div class="banner-dot"></div>
    <p class="banner-text" data-key="banner_main"></p>
  </div>
  <span class="banner-scale" data-key="banner_scale"></span>
</div>

<div class="page">

  <!-- ── HERO ─────────────────────────────────────────────────────── -->
  <div class="hero">
    <p class="hero-label" data-key="hero_label"></p>
    <h1 class="hero-title" data-key="hero_title"></h1>
    <p class="hero-sub"   data-key="hero_sub"></p>
    <div class="stats-row" id="stats-row"></div>
  </div>

  <!-- ── SCOPE ─────────────────────────────────────────────────────── -->
  <div class="section">
    <div class="section-hd">
      <h2 data-key="scope_title"></h2>
      <p  data-key="scope_sub"></p>
    </div>
    <div class="scope-grid">
      <div class="scope-card">
        <h3 data-key="scope_seniority"></h3>

    <div class="rules-callout">
      <h4 data-key="rules_title"></h4>
      <div class="rules-list" id="rules-list"></div>
    </div>
  </div>

  <!-- ── LOAD ──────────────────────────────────────────────────────── -->
  <div class="section">
    <div class="section-hd">
      <h2 data-key="load_title"></h2>
      <p  data-key="load_sub"></p>
    </div>
    <div class="load-grid">
      <div class="load-card">
        <h3 data-key="load_partner_title"></h3>
        <div id="partner-load"></div>
      </div>
      <div class="load-card">
        <h3 data-key="load_manager_title"></h3>
        <div id="manager-load"></div>
      </div>
    </div>
  </div>

  <!-- ── FOOTER CTA ─────────────────────────────────────────────────── -->
  <div class="footer-cta">
    <h3 data-key="footer_title"></h3>
    <p  data-key="footer_sub"></p>
    <a href="https://www.linkedin.com/in/gilbernon" target="_blank" rel="noopener" data-key="footer_cta"></a>
  </div>

</div>

<script>

const REGION_ORDER = ['LATAM', 'North America', 'EMEA', 'APAC'];
const REGION_CLS   = { LATAM: 'latam', 'North America': 'na', EMEA: 'emea', APAC: 'apac' };

let currentLang = 'pt';

function t(key) { return LANG[currentLang][key] || key; }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAll(lang) {
  currentLang = lang;
  const L = LANG[lang];

  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    if (L[key] !== undefined) el.innerHTML = L[key];
  });

  renderStats(L);
  renderSeniority(L);
  renderPartners(L);
  renderSessions(L);
  renderRules(L);
  renderLoad(L);
}

function renderStats(L) {
  document.getElementById('stats-row').innerHTML = L.stats.map(s =>
    `<div class="stat">
      <div class="stat-val">${s.val}</div>
      <div class="stat-lbl">${escHtml(s.lbl)}</div>
    </div>`
  ).join('');
}

function renderSeniority(L) {
  const max = Math.max(...L.seniority.map(s => s.count));
  document.getElementById('seniority-bars').innerHTML = L.seniority.map(s =>
    `<div class="seniority-row">
      <span class="seniority-name">${escHtml(s.name)}</span>
      <div class="seniority-bar-wrap">
        <div class="seniority-bar" style="width:${Math.round(s.count/max*100)}%"></div>
      </div>
      <span class="seniority-count">${s.count}</span>
    </div>`
  ).join('');
}

function renderPartners(L) {
  const regLabel = r => (L.regions && L.regions[r]) ? L.regions[r] : r;
  document.getElementById('partner-list').innerHTML = DATA.partners.map(p =>
    `<div class="partner-row">
      <div class="partner-info">
        <div class="partner-avatar">${escHtml(p.name[0])}</div>
        <div>
          <div class="partner-name">${escHtml(p.name)}</div>
          <div class="partner-region">${escHtml(regLabel(p.region))}</div>
        </div>
      </div>
      <span class="partner-sessions">${p.sessions} ${p.sessions === 1 ? 'session' : (currentLang === 'pt' ? 'sessões' : 'sessions')}</span>
    </div>`
  ).join('');
}

function renderSessions(L) {
  const regLabel = r => (L.regions && L.regions[r]) ? L.regions[r] : r;
  const grouped  = {};
  REGION_ORDER.forEach(r => { grouped[r] = []; });
  DATA.sessions.forEach(s => { if (grouped[s.region]) grouped[s.region].push(s); });

  let html = '';
  REGION_ORDER.forEach(region => {
    const sessions = grouped[region];
    if (!sessions.length) return;
    const cls = REGION_CLS[region];
    html += `<div class="region-block">
      <div class="region-hd">
        <span class="region-badge ${cls}">${escHtml(regLabel(region))}</span>
        <span class="region-count">${sessions.length} ${currentLang === 'pt' ? 'sessões' : 'sessions'}</span>
      </div>
      <div class="sessions-grid">
        ${sessions.map(s => renderSessionCard(s, L, cls)).join('')}
      </div>
    </div>`;
  });
  document.getElementById('sessions-container').innerHTML = html;
  renderLegend(L);
}

function renderSessionCard(s, L, cls) {
  const levelClass  = s.level.includes('·') ? 'mixed' : '';
  const cardId      = `detail-${s.region.replace(/\s/g,'-')}-${s.n}`;
  const btnId       = `btn-${cardId}`;

  const mgrPills = s.managers.map(m =>
    `<span class="mgr-pill ${cls}">${escHtml(m)}</span>`
  ).join('');

  const tagPills = s.tags.map(tag => {
    if (tag === 'review')    return `<span class="tag tag-review">${L.tag_review}</span>`;
    if (tag === 'exception') return `<span class="tag tag-exception">${L.tag_exception}</span>`;
    return '';
  }).join('');

  const detailRows = (s.contributors || []).map(c =>
    `<tr>
      <td>${escHtml(c.name)}${c.isMgr ? ` <span class="person-is-mgr">${L.tag_review}</span>` : ''}</td>
      <td>${escHtml(c.level)}</td>
      <td>${escHtml(c.manager)}</td>
    </tr>`
  ).join('');

  return `<div class="session-card">
    <div class="session-card-top ${cls}"></div>
    <div class="session-card-body">
      <div class="session-row1">
        <span class="session-id">#${s.n}</span>
        <span class="level-pill ${levelClass}">${escHtml(s.level)}</span>
      </div>
      <div class="session-roles">
        <div class="role-row"><span class="role-key">${L.label_partner}</span><span class="role-val">${escHtml(s.partner)}</span></div>
        <div class="role-row"><span class="role-key">${L.label_calibrator}</span><span class="role-val">${escHtml(s.calibrator)}</span></div>
      </div>
      <div class="session-counts">
        <div class="count-box">
          <div class="count-num">${s.managers.length}</div>
          <div class="count-lbl">${L.label_managers}</div>
        </div>
        <div class="count-box">
          <div class="count-num">${s.people}</div>
          <div class="count-lbl">${L.label_people}</div>
        </div>
      </div>
      ${mgrPills ? `<div class="session-managers">${mgrPills}</div>` : ''}
      ${tagPills ? `<div class="session-tags">${tagPills}</div>` : ''}
      <div class="session-footer">
        <button class="expand-btn" id="${btnId}" onclick="toggleDetail('${cardId}','${btnId}')">
          <span class="btn-label">${L.btn_expand}</span>
          <span class="arrow">▼</span>
        </button>
      </div>
      <div class="session-detail" id="${cardId}">
        <table class="detail-table">
          <thead>
            <tr>
              <th>${L.detail_col_name}</th>
              <th>${L.detail_col_level}</th>
              <th>${L.detail_col_manager}</th>
            </tr>
          </thead>
          <tbody>${detailRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function toggleDetail(cardId, btnId) {
  const detail = document.getElementById(cardId);
  const btn    = document.getElementById(btnId);
  const L      = LANG[currentLang];
  const isOpen = detail.classList.contains('open');
  detail.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
  btn.querySelector('.btn-label').textContent = isOpen ? L.btn_expand : L.btn_collapse;
}

function renderLegend(L) {
  document.getElementById('legend-container').innerHTML =
    `<div class="legend">
      <div class="legend-item">
        <span class="legend-tag"><span class="tag tag-review">${L.tag_review}</span></span>
        <span class="legend-desc">${escHtml(L.legend_review_desc)}</span>
      </div>
      <div class="legend-item">
        <span class="legend-tag"><span class="tag tag-exception">${L.tag_exception}</span></span>
        <span class="legend-desc">${escHtml(L.legend_exception_desc)}</span>
      </div>
    </div>`;
}

function renderRules(L) {
  document.getElementById('rules-list').innerHTML = L.rules.map(r =>
    `<span class="rule-chip">${escHtml(r)}</span>`
  ).join('');
}

function renderLoad(L) {
  const partnerMax = Math.max(...DATA.partners.map(p => p.sessions));
  const regLabel = r => (L.regions && L.regions[r]) ? L.regions[r] : r;
  document.getElementById('partner-load').innerHTML = DATA.partners.map(p =>
    `<div class="load-row">
      <span class="load-name" title="${escHtml(p.name)}">${escHtml(p.name)}</span>
      <div class="load-bar-wrap">
        <div class="load-bar ${p.cls}" style="width:${Math.round(p.sessions/partnerMax*100)}%"></div>
      </div>
      <span class="load-val">${p.sessions}</span>
    </div>`
  ).join('');

  const mgrMax = Math.max(...DATA.managerLoad.map(m => m.sessions));
  document.getElementById('manager-load').innerHTML = DATA.managerLoad.map(m =>
    `<div class="load-row">
      <span class="load-name" title="${escHtml(m.name)}">${escHtml(m.name)}</span>
      <div class="load-bar-wrap">
        <div class="load-bar ${m.cls}" style="width:${Math.round(m.sessions/mgrMax*100)}%"></div>
      </div>
      <span class="load-val">${m.sessions}</span>
    </div>`
  ).join('');
}

function setLang(lang) { renderAll(lang); }

window.addEventListener('DOMContentLoaded', () => renderAll('pt'));
</script>

</body>
</html>
