function renderSessions(L) {
  const regLabel = r => (L.regions && L.regions[r]) ? L.regions[r] : r;
  const grouped  = {};
  REGION_ORDER.forEach(r => { grouped[r] = []; });
  DATA.sessions.forEach(s => { if (grouped[s.region]) grouped[s.region].push(s); });

  let html = '';
  REGION_ORDER.forEach(region => {
    const sessions = grouped[region];
    if (!sessions.length) return;
    const cls = REGION_CLS[region];
    html += `<div class="region-block">
      <div class="region-hd">
        <span class="region-badge ${cls}">${escHtml(regLabel(region))}</span>
        <span class="region-count">${sessions.length} ${currentLang === 'pt' ? 'sessões' : 'sessions'}</span>

        ${sessions.map(s => renderSessionCard(s, L, cls)).join('')}

function renderSessionCard(s, L, cls) {
  const levelClass  = s.level.includes('·') ? 'mixed' : '';
  const cardId      = `detail-${s.region.replace(/\s/g,'-')}-${s.n}`;
  const btnId       = `btn-${cardId}`;

  const mgrPills = s.managers.map(m =>
    `<span class="mgr-pill ${cls}">${escHtml(m)}</span>`
  ).join('');

  const tagPills = s.tags.map(tag => {
    if (tag === 'review')    return `<span class="tag tag-review">${L.tag_review}</span>`;
    if (tag === 'exception') return `<span class="tag tag-exception">${L.tag_exception}</span>`;
    return '';
  }).join('');

  const detailRows = (s.contributors || []).map(c =>
    `<tr>
      <td>${escHtml(c.name)}${c.isMgr ? ` <span class="person-is-mgr">${L.tag_review}</span>` : ''}</td>
      <td>${escHtml(c.level)}</td>
      <td>${escHtml(c.manager)}</td>
    </tr>`
  ).join('');

  return `<div class="session-card">
    <div class="session-card-top ${cls}"></div>
    <div class="session-card-body">
      <div class="session-row1">
        <span class="session-id">#${s.n}</span>
        <span class="level-pill ${levelClass}">${escHtml(s.level)}</span>
      </div>
      <div class="session-roles">
        <div class="role-row"><span class="role-key">${L.label_partner}</span><span class="role-val">${escHtml(s.partner)}</span></div>
        <div class="role-row"><span class="role-key">${L.label_calibrator}</span><span class="role-val">${escHtml(s.calibrator)}</span></div>
      </div>
      <div class="session-counts">
        <div class="count-box">
          <div class="count-num">${s.managers.length}</div>
          <div class="count-lbl">${L.label_managers}</div>
        </div>
        <div class="count-box">
          <div class="count-num">${s.people}</div>
          <div class="count-lbl">${L.label_people}</div>
        </div>
      </div>
      ${mgrPills ? `<div class="session-managers">${mgrPills}</div>` : ''}
      ${tagPills ? `<div class="session-tags">${tagPills}</div>` : ''}
      <div class="session-footer">
        <button class="expand-btn" id="${btnId}" onclick="toggleDetail('${cardId}','${btnId}')">
          <span class="btn-label">${L.btn_expand}</span>
          <span class="arrow">▼</span>
        </button>
      </div>
      <div class="session-detail" id="${cardId}">
        <table class="detail-table">
          <thead>
            <tr>
              <th>${L.detail_col_name}</th>
              <th>${L.detail_col_level}</th>
              <th>${L.detail_col_manager}</th>
            </tr>
          </thead>
          <tbody>${detailRows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function toggleDetail(cardId, btnId) {
  const detail = document.getElementById(cardId);

  const L      = LANG[currentLang];
  const isOpen = detail.classList.contains('open');

  btn.querySelector('.btn-label').textContent = isOpen ? L.btn_expand : L.btn_collapse;
}
